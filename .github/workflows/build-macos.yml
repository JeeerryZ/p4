name: macOS build

# Runs on every push to main, on version tags, and can be triggered manually
on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # git-cliff's action is a Docker container action, which GitHub Actions
  # only supports on Linux runners — it cannot run directly on macos-14.
  # Generate the changelog once here and hand it to the build jobs below.
  changelog:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v3
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: macos-changelog
          path: CHANGES.md
          retention-days: 1

  build:
    needs: [changelog]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14    # Apple Silicon (ARM64), native build
            arch: arm64
            brew_prefix: /opt/homebrew
            arch_prefix: ""
          - runner: macos-14    # Intel (x86_64), cross-built via Rosetta 2
            arch: x86_64
            brew_prefix: /usr/local
            arch_prefix: "arch -x86_64"

    runs-on: ${{ matrix.runner }}

    steps:
      # ── Source ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Dependencies ──────────────────────────────────────────────────────
      # The runner only ships a native arm64 Homebrew at /opt/homebrew. The
      # x86_64 leg needs its own Rosetta-native Homebrew at /usr/local —
      # `arch -x86_64 brew` alone still resolves to the arm64 install via
      # PATH and Homebrew correctly refuses to operate cross-arch on it.
      - name: Install Rosetta Homebrew
        if: matrix.arch == 'x86_64'
        run: |
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Install dependencies
        run: ${{ matrix.arch_prefix }} ${{ matrix.brew_prefix }}/bin/brew install qt gmp mpfr

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Configure with qmake
        run: |
          export PATH="${{ matrix.brew_prefix }}/opt/qt/bin:$PATH"
          ${{ matrix.arch_prefix }} qmake -r P4.pro

      - name: Compile
        run: ${{ matrix.arch_prefix }} make -j$(sysctl -n hw.logicalcpu)

      - name: Verify build architecture
        run: |
          actual=$(lipo -archs build/p4/p4)
          if [ "$actual" != "${{ matrix.arch }}" ]; then
            echo "Expected ${{ matrix.arch }}, got: $actual"
            exit 1
          fi

      # ── Assemble .app bundle ──────────────────────────────────────────────
      # p4 is built as a plain Unix binary (CONFIG -= app_bundle in p4.pro).
      # We wrap it in a minimal .app so macdeployqt can bundle Qt frameworks,
      # then place the helper binaries alongside p4 inside Contents/MacOS/.
      - name: Wrap in .app and deploy Qt frameworks
        run: |
          export PATH="${{ matrix.brew_prefix }}/opt/qt/bin:$PATH"

          mkdir -p P4.app/Contents/MacOS P4.app/Contents/Resources
          cp build/p4/p4 P4.app/Contents/MacOS/

          cat > P4.app/Contents/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>     <string>p4</string>
            <key>CFBundleIdentifier</key>     <string>cat.gsd.p4</string>
            <key>CFBundleName</key>           <string>P4</string>
            <key>CFBundleDisplayName</key>    <string>P4</string>
            <key>CFBundleVersion</key>        <string>7.1.0</string>
            <key>CFBundleShortVersionString</key> <string>7.1.0</string>
            <key>CFBundlePackageType</key>    <string>APPL</string>
            <key>CFBundleIconFile</key>       <string>P4.icns</string>
            <key>LSMinimumSystemVersion</key> <string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # Generate P4.icns from help/newp4icon.ico
          ICONSET="P4.iconset"
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          sips -s format png help/newp4icon.ico --out p4icon_src.png
          for sz in 16 32 128 256 512; do
              sips -z "$sz" "$sz" p4icon_src.png --out "$ICONSET/icon_${sz}x${sz}.png"
              sips -z $((sz*2)) $((sz*2)) p4icon_src.png --out "$ICONSET/icon_${sz}x${sz}@2x.png"
          done
          iconutil -c icns "$ICONSET" -o P4.app/Contents/Resources/P4.icns

          ${{ matrix.arch_prefix }} macdeployqt P4.app

          # Helper binaries must sit alongside p4 so applicationDirPath() finds them
          cp build/lyapunov/lyapunov \
             build/lyapunov_mpf/lyapunov_mpf \
             build/separatrice/separatrice \
             P4.app/Contents/MacOS/

      # ── Create DMG ────────────────────────────────────────────────────────
      - name: Create DMG
        run: |
          ${{ matrix.arch_prefix }} ${{ matrix.brew_prefix }}/bin/brew install create-dmg

          ${{ matrix.arch_prefix }} ${{ matrix.brew_prefix }}/bin/create-dmg \
            --volname "P4" \
            --volicon "help/p4smallicon.png" \
            --window-size 540 360 \
            --icon-size 128 \
            --icon "P4.app" 180 160 \
            --app-drop-link 360 160 \
            --hide-extension "P4.app" \
            P4-macOS-${{ matrix.arch }}.dmg \
            P4.app

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: P4-macOS-${{ matrix.arch }}
          path: P4-macOS-${{ matrix.arch }}.dmg
          retention-days: 30

      # ── Release notes ────────────────────────────────────────────────────
      - name: Download changelog
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          name: macos-changelog

      # On a version tag (1.2.3), attach the DMG to a GitHub Release
      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: P4-macOS-${{ matrix.arch }}.dmg
          body_path: CHANGES.md
