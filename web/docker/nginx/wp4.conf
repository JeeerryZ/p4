# =============================================================================
# nginx reverse-proxy configuration for P4 Web
# =============================================================================
#
# Topology:
#   Browser  →  nginx:80  →  backend:8080 (Crow C++ REST API)
#
# Why nginx in front of Crow?
#   - SSL termination (add HTTPS here without touching C++ code)
#   - Static file serving for the React SPA (Phase 4)
#   - Rate limiting and connection buffering
#   - The backend never needs to be exposed directly to the internet
# =============================================================================

upstream wp4_backend {
    # "backend" resolves to the backend container via Docker's internal DNS.
    # keepalive 32: maintain a pool of 32 persistent connections to the backend
    # so each request doesn't pay a TCP handshake cost.
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;           # match any hostname; narrow this in production

    # ── API proxy ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://wp4_backend;
        proxy_http_version 1.1;

        # Required for keepalive connections to the upstream.
        proxy_set_header   Connection "";

        # Pass the real client IP and host to the backend for logging.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Maple evaluation can take up to 60 s (configurable in ScriptHandler).
        # Set all three nginx timeouts above that to avoid premature 504s.
        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Disable response buffering: stream the JSON result back as soon as
        # the backend sends it rather than collecting it in nginx memory.
        proxy_buffering off;

        # Allow larger request bodies (polynomials with many terms can be long).
        client_max_body_size 1m;
    }

    # ── React SPA (Phase 4) ──────────────────────────────────────────────────
    # Static files will be served from here once the frontend is built.
    # For now this block acts as a placeholder; once Phase 4 is done, the
    # docker-compose build copies the frontend dist/ here.
    location / {
        root   /usr/share/nginx/html;

        # SPA fallback: any path that isn't a real file is rewritten to
        # index.html so React Router handles client-side navigation.
        try_files $uri $uri/ /index.html;

        # Cache control for SPA assets.
        # index.html: no cache (so browsers always get the latest app version)
        # Everything else (JS/CSS bundles with content hashes): cache 1 year.
        location ~* \.(?:html)$ {
            add_header Cache-Control "no-cache";
        }
        location ~* \.(?:js|css|woff2|png|svg|ico)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # ── Health check passthrough ──────────────────────────────────────────────
    # Docker/orchestrators can hit /health to confirm the whole stack is up.
    # nginx itself is healthy if it can proxy to backend's /api/health.
    location /health {
        proxy_pass http://wp4_backend/api/health;
    }
}
